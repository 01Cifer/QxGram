name: 🐞 Bug report
description: Report errors or unexpected behavior.
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: Tell us what should happen
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behaviour
      placeholder: Tell us what happens instead
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      description: |
        Write exact OS (e.g. Windows 11, macOS 14, Ubuntu 24.04 GNOME).
        * 🛑 NO KERNEL VERSIONS (uname)
    validations:
      required: true
  - type: input
    attributes:
      label: Version of QxGram
      description: |
        Include the exact QxGram version number (for example, 7.4.6).
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installation source
      multiple: false
      options:
        - QxGram GitHub release
        - Built from source
        - Other source
    validations:
      required: true
  - type: input
    attributes:
      label: Crash details
      description: |
        Include any relevant error message, without personal data.
  - type: textarea
    attributes:
      label: Logs
      description: >
        Remove phone numbers, access tokens, and other private data before
        sharing logs. Never upload your tdata folder.
      placeholder: Insert log.txt here
      render: shell
